name: CI/CD Pipeline

on:
  push:
    branches: ["DevLab"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: java-docker-app
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.ECR_REPO }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      SUBNETS: ${{ secrets.SUBNETS }}
      SECURITY_GROUPS: ${{ secrets.SECURITY_GROUPS }}

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Java 21
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Build application
      - name: Build App
        run: mvn clean package -DskipTests

      # 4️⃣ Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5️⃣ Build Docker image (fixed path)
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -f docker/Dockerfile .

      # 6️⃣ Push Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin $ECR_REPO
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REPO:$IMAGE_TAG
          docker push $ECR_REPO:$IMAGE_TAG

      # 7️⃣ Deploy to ECS using Java ECSDeployer
      - name: Deploy using Java ECSDeployer
        run: |
          export DOCKER_IMAGE=$ECR_REPO:$IMAGE_TAG
          java -cp target/*.jar devlab.sudip.java_deploy.ECSDeployer
